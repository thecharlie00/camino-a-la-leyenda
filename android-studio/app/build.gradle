/* Las contraseñas de firma viven en ../signing.properties (no se sube a git) */
def signingProps = new Properties()
def signingFile = rootProject.file("signing.properties")
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }
def signingProp(String k) { return signingProps.getProperty(k, (project.findProperty(k) ?: "").toString()) }

plugins {
    id 'com.android.application'
}

def TEST_APP_ID = 'ca-app-pub-3940256099942544~3347511713'
def TEST_INTERSTITIAL = 'ca-app-pub-3940256099942544/1033173712'

android {
    namespace 'com.caminoleyenda.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.caminoleyenda.app'
        minSdk 24
        targetSdk 36
        versionCode 32
        versionName '3.5'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file(UPLOAD_STORE_FILE)
            storePassword signingProp("UPLOAD_STORE_PASSWORD")
            keyAlias UPLOAD_KEY_ALIAS
            keyPassword signingProp("UPLOAD_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            // al probar desde Android Studio siempre salen anuncios de prueba (nunca hagas clic en los tuyos)
            manifestPlaceholders = [admobAppId: TEST_APP_ID]
            buildConfigField 'String', 'AD_UNIT_INTERSTITIAL', "\"${TEST_INTERSTITIAL}\""
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            manifestPlaceholders = [admobAppId: ADMOB_APP_ID]
            buildConfigField 'String', 'AD_UNIT_INTERSTITIAL', "\"${ADMOB_INTERSTITIAL_ID}\""
        }
    }

    /* dos versiones del juego: «noads» (sin anuncios, la de ahora) y «ads» (con AdMob)
       En Android Studio: Build → Select Build Variant → noadsRelease o adsRelease */
    flavorDimensions = ['ads']
    productFlavors {
        noads {
            dimension 'ads'
        }
        ads {
            dimension 'ads'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // aviso de actualización (sistema oficial de Google Play)
    implementation 'com.google.android.play:app-update:2.1.0'
    // anuncios: solo en la versión «ads»
    adsImplementation 'com.google.android.gms:play-services-ads:23.6.0'
    adsImplementation 'com.google.android.ump:user-messaging-platform:3.1.0'
}
