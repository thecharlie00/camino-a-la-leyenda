# ===== AdMob =====
# Ahora mismo son los ID de PRUEBA de Google (muestran anuncios de prueba).
# Antes de publicar, cámbialos por los tuyos de https://admob.google.com
#   ADMOB_APP_ID          → Apps → tu app → Configuración de la app → "ID de aplicación" (lleva ~)
#   ADMOB_INTERSTITIAL_ID → Bloques de anuncios → Intersticial → "ID del bloque de anuncios" (lleva /)
ADMOB_APP_ID=ca-app-pub-3940256099942544~3347511713
ADMOB_INTERSTITIAL_ID=ca-app-pub-3940256099942544/1033173712

# Clave de subida a Google Play (la misma de siempre). Las contraseñas van en signing.properties, que no se sube a git.
UPLOAD_STORE_FILE=../camino.keystore
UPLOAD_KEY_ALIAS=camino
