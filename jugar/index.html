<script>
/* el juego arranca en el idioma de la página y con la simulación 3D activada */
(function () {
  var l = document.body.getAttribute("data-lang"), f = document.getElementById("game");
  var t3 = document.getElementById("toggle3d"), txt3 = document.getElementById("txt3d");
  var is3d = true;
  try {
    var prev = localStorage.getItem("camino.weblang");
    if (prev !== l || !localStorage.getItem("camino.lang")) localStorage.setItem("camino.lang", l);
    localStorage.setItem("camino.weblang", l);
    var p3 = localStorage.getItem("camino.pitch3d");
    if (p3 === "0") is3d = false;
    else { is3d = true; localStorage.setItem("camino.pitch3d", "1"); }
  } catch (e) {}

  function updateBtn() {
    if (!t3) return;
    t3.classList.toggle("pri", is3d);
    if (txt3) txt3.textContent = is3d ? "3D Activo" : "Modo 2D";
  }
  updateBtn();

  if (t3) {
    t3.addEventListener("click", function () {
      is3d = !is3d;
      try { localStorage.setItem("camino.pitch3d", is3d ? "1" : "0"); } catch (e) {}
      updateBtn();
      if (f) {
        var base = f.getAttribute("data-src") || "../jugar/juego.html";
        f.src = base + (is3d ? "?pitch3d=1" : "?pitch3d=0");
      }
    });
  }

  var baseSrc = f.getAttribute("data-src") || "../jugar/juego.html";
  f.src = baseSrc + (is3d ? "?pitch3d=1" : "");
})();
</script>
