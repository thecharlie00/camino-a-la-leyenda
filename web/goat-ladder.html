<!doctype html>
<html lang="{{LANG}}">
<head>
{{HEAD}}
<title>{{t:goat_meta_title}}</title>
<meta name="description" content="{{t:goat_meta_desc}}">
<link rel="canonical" href="{{URL}}">
{{ALT}}
</head>
<body class="goat-page" data-lang="{{LANG}}">
<a class="skip" href="#main">{{t:skip}}</a>
<header class="top"><div class="wrap">
  <a class="brand" href="{{R}}"><img src="{{R}}img/icon-72.png" width="36" height="36" alt="">Camino a la Leyenda</a>
  <nav aria-label="{{t:nav_label}}"><a class="goat-tab" href="{{GOAT_URL}}" aria-current="page">{{t:goat_nav}}</a>{{LANGMENU}}<a class="btn pri sm" href="{{R}}jugar/">{{t:play_now}}</a></nav>
</div></header>
<main id="main" class="goat-main">
  <section class="goat-hero wrap">
    <p class="goat-kicker">🏆 {{t:goat_nav}}</p>
    <h1>{{t:goat_nav}}</h1>
    <p class="goat-intro">{{t:goat_intro}}</p>
  </section>
  <section class="goat-board wrap" aria-label="{{t:goat_nav}}">
    <div class="goat-filters">
      <div class="goat-segment" role="group" aria-label="{{t:goat_nav}}">
        <button type="button" data-board="careers" aria-pressed="true">{{t:goat_careers}}</button>
        <button type="button" data-board="achievements" aria-pressed="false">{{t:goat_achievements}}</button>
      </div>
      <div class="goat-segment" role="group" aria-label="{{t:nav_modes}}">
        <button type="button" data-mode="player" aria-pressed="true">{{t:goat_player}}</button>
        <button type="button" data-mode="manager" aria-pressed="false">{{t:goat_manager}}</button>
      </div>
      <label class="goat-metric-label" for="goat-metric">{{t:goat_metric}}
        <select id="goat-metric" class="goat-metric"></select>
      </label>
      <div class="goat-segment" role="group" aria-label="{{t:goat_all_time}}">
        <button type="button" data-period="all-time" aria-pressed="true">{{t:goat_all_time}}</button>
        <button type="button" data-period="30d" aria-pressed="false">{{t:goat_30d}}</button>
        <button type="button" data-period="7d" aria-pressed="false">{{t:goat_7d}}</button>
      </div>
    </div>
    <p class="goat-status" id="goat-status" role="status" aria-live="polite"></p>
    <div class="goat-cards" id="goat-entries"></div>
    <button class="btn goat-retry" id="goat-retry" type="button" hidden>{{t:goat_retry}}</button>
  </section>
  <p class="goat-footnote wrap">{{t:goat_unverified}}</p>
</main>
{{FOOT}}
<script>window.GOAT_API_URL = {{GOAT_API_URL}};</script>
<script src="{{R}}goat-ladder.js" defer></script>
<script src="{{R}}site.js" defer></script>
</body>
</html>
