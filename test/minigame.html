<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minijuegos — banco de pruebas</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="../src/style.css">
<script>
function tr(s,p){return s.replace(/\{(\w+)\}/g,function(m,k){return p&&p[k]!=null?p[k]:m;});}
function seeded(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var RESULTS=[];
function openPen(o){Minigame.penalty(o||{skill:78,gk:72,pressure:0.5,rand:seeded(7)},function(r){RESULTS.push({kind:"penalty",res:r,overlays:document.querySelectorAll(".mg-ov").length});});}
function openFk(o){Minigame.freekick(o||{skill:80,gk:70,dist:22,rand:seeded(11)},function(r){RESULTS.push({kind:"freekick",res:r,overlays:document.querySelectorAll(".mg-ov").length});});}
function openGkPen(o){Minigame.gkPenalty(o||{gk:74,skill:76,pressure:0.5,rand:seeded(21)},function(r){RESULTS.push({kind:"gkPenalty",res:r,overlays:document.querySelectorAll(".mg-ov").length});});}
function openGkFk(o){Minigame.gkFreekick(o||{gk:74,skill:80,dist:22,rand:seeded(5)},function(r){RESULTS.push({kind:"gkFreekick",res:r,overlays:document.querySelectorAll(".mg-ov").length});});}
</script>
<script src="../src/anim.js"></script>
<script src="../src/minigame.js"></script>
</head>
<body>
<main style="padding:16px">
  <h1>Camino a la Leyenda</h1>
  <p>Banco de pruebas de los minijuegos.</p>
  <p><button class="btn pri" onclick="openPen()">Penalti</button> <button class="btn" onclick="openFk()">Falta directa</button></p>
  <p><button class="btn" onclick="openGkPen()">Penalti (portero)</button> <button class="btn" onclick="openGkFk()">Falta (portero)</button></p>
</main>
</body>
</html>
