<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Galería de escudos</title>
<style>
@font-face { font-family: "Archivo"; font-weight: 800; src: url("../fonts/node_modules/@fontsource/archivo/files/archivo-latin-800-normal.woff2") format("woff2"); }
:root { --f-body: "Archivo", "Roboto", system-ui, sans-serif; }
body { margin: 12px; background: #0b1417; color: #edf1e8; font: 12px/1.3 var(--f-body); }
h2 { font-size: 13px; color: #91a4a6; margin: 16px 0 6px; text-transform: uppercase; letter-spacing: .1em; }
.g { display: grid; gap: 6px; }
.cell { background: #18292f; border-radius: 8px; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.row { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; justify-content: center; }
.lbl { font-size: 10px; color: #91a4a6; }
.line { display: flex; align-items: center; gap: 6px; background: #111e22; padding: 4px 6px; border-radius: 6px; font-size: 13px; }
</style></head><body>
<h2>Formas × patrones (pequeño 22×25)</h2><div id="small" class="g"></div>
<h2>Formas × patrones (grande 34×39)</h2><div id="big" class="g"></div>
<h2>Camisetas</h2><div id="kits" class="g" style="grid-template-columns:repeat(11,1fr)"></div>
<h2>crestAuto · clubes del juego</h2><div id="auto" class="g" style="grid-template-columns:repeat(3,1fr)"></div>
<script src="../src/i18n.js"></script>
<script src="../src/data.js"></script>
<script src="../src/engine-core.js"></script>
<script src="../src/crest.js"></script>
<script>
var COLS = [["#c8102e", "#ffffff"], ["#f4f4f4", "#1d2b5a"], ["#004d98", "#a50044"], ["#fde100", "#111111"], ["#0bb363", "#f4f4f4"], ["hsl(200,58%,40%)", "hsl(20,70%,60%)"]];
var ABS = ["ATM", "RMA", "FCB", "BVB", "BET", "XYZ"];
function grid(id, big) {
  var el = document.getElementById(id), o = "";
  el.style.gridTemplateColumns = "repeat(" + (CREST_SHAPES.length > 9 ? 9 : CREST_SHAPES.length) + ",1fr)";
  CREST_SHAPES.forEach(function (sh, si) {
    var r = "";
    CREST_PATS.forEach(function (p, pi) {
      var k = (si + pi) % COLS.length;
      r += crestSVG({shape: sh[0], pat: p[0], col: COLS[k], ab: ABS[k], big: big});
    });
    o += '<div class="cell"><div class="row">' + r + '</div><div class="lbl">' + sh[0] + " · " + sh[1] + "</div></div>";
  });
  el.innerHTML = o;
}
grid("small", false); grid("big", true);
document.getElementById("kits").innerHTML = KIT_PATS.map(function (p, i) {
  var c = [["#004d98", "#a50044", "#ffffff"], ["#f4f4f4", "#111111", "#c8102e"], ["#fde100", "#111111", "#111111"], ["#c8102e", "#ffffff", "#ffffff"]][i % 4];
  return '<div class="cell">' + kitSVG({pat: p[0], col: c, big: true}) + kitSVG({pat: p[0], col: c}) + '<div class="lbl">' + p[0] + "</div></div>";
}).join("");
var NAMES = ["FC Barcelona", "Real Madrid", "Atlético de Madrid", "Bayern Múnich", "Juventus", "Inter", "Chelsea", "Arsenal",
  "Manchester City", "Liverpool", "Paris Saint-Germain", "Boca Juniors", "River Plate", "Ajax", "AC Milan", "Borussia Dortmund",
  "Athletic Club", "Real Betis", "Villarreal CF", "Real Sociedad", "Celta de Vigo", "Sevilla FC", "Newcastle United", "Napoli",
  "AS Roma", "Olympique de Lyon", "Feyenoord", "Racing Club", "Flamengo", "Getafe CF", "Rayo Vallecano", "Brentford"];
function ab(nm) { return abbr(nm); }
document.getElementById("auto").innerHTML = NAMES.map(function (n) {
  var col = DATA.colors[n] || ["#556066", "#f4f4f4"];
  return '<div class="line">' + crestAuto(n, col, ab(n)) + crestAuto(n, col, ab(n), true) + "<span>" + n + "</span></div>";
}).join("");
</script>
</body></html>
