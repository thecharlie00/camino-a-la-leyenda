name: Diag CI
on:
  push:
    branches: [diag-ci]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: |
          : > diag.txt
          for i in 1 2 3 4 5; do npm run test:build > run.txt 2>&1 || { echo "=== RUN $i FAILED" >> diag.txt; tail -60 run.txt >> diag.txt; }; done
          echo DONE >> diag.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f diag.txt && git commit -q -m "Resultado [skip ci]" && git push -q origin HEAD:diag-ci
