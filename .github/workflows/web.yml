# Publica la web (GitHub Pages, rama gh-pages) con el juego para jugar en el navegador.
# Solo publica cuando se pide:
# - a mano, desde la pestaña Actions («Run workflow»), o
# - con un commit en main cuyo mensaje incluya «[web]».
# Ajustes de anuncios y dominio: web/config.json. Primera vez: Settings → Pages → «Deploy from a branch» → gh-pages / (root).
name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web
  cancel-in-progress: true

jobs:
  pages:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[web]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar el juego y la web
        run: |
          python3 build.py
          python3 build_web.py
      - name: Publicar en la rama gh-pages
        run: |
          cd dist/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
