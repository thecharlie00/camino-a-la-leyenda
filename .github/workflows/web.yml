# Builds the Vite site/game and publishes it to the gh-pages branch.
# Run on demand or with a [web] commit to main.
name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web
  cancel-in-progress: true

jobs:
  pages:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[web]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Compilar web y juego
        run: npm run build

      - name: Comprobar los archivos publicados
        run: npm run test:build

      - name: Preparar sitio
        run: |
          mkdir -p web-output/site
          cp -a dist/. web-output/site/

      - name: Publicar en la rama gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd web-output/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
