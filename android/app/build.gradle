plugins {
    id 'com.android.application'
}

def gameAssetsDir = layout.buildDirectory.dir('generated/game-assets')

def envOr = { String key, String fallback ->
    def value = System.getenv(key)
    value == null || value.trim().isEmpty() ? fallback : value
}

android {
    namespace 'com.caminoleyenda.app'
    compileSdk 37
    buildToolsVersion '37.0.0'

    defaultConfig {
        applicationId 'com.caminoleyenda.app'
        minSdk 24
        targetSdk 36
        versionCode envOr('VERSION_CODE', '71').toInteger()
        versionName envOr('VERSION_NAME', '5.21')
    }

    sourceSets {
        main {
            manifest.srcFile '../AndroidManifest.xml'
            java.srcDirs = ['../src']
            res.srcDirs = ['../res']
            assets.srcDir(gameAssetsDir)
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            storeFile file(envOr('CAMINO_KEYSTORE', "${rootProject.projectDir}/camino.keystore"))
            storePassword envOr('CAMINO_KS_PASS', '')
            keyAlias envOr('CAMINO_KEY_ALIAS', 'camino')
            keyPassword envOr('CAMINO_KS_PASS', '')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

tasks.register('prepareGameAssets', Copy) {
    from(rootProject.file('../dist/android/jugar/juego.html'))
    into(gameAssetsDir.map { it.dir('jugar') })
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('prepareGameAssets'))
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:24.7.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'
}
